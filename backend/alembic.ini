# A generic, single database configuration.

[alembic]
script_location = alembic
prepend_sys_path = .

# Use the DATABASE_URL from the environment (overridden in env.py).
# Alembic's env.py reads from app.config directly.
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/ciphertrade

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

